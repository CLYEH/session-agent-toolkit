name: tests

on:
  push:
  pull_request:

jobs:
  linux-tmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: bash tests/run-in-tmux.sh

  macos-tmux:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install tmux
      - run: bash tests/run-in-tmux.sh

  macos-terminal-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/run-in-terminal-app.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: pwsh -NoProfile -File tests/test-restart-session.ps1
